version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: sawiya-postgres
    environment:
      POSTGRES_DB: sawiya_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sawiya_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sawiya-redis
    ports:
      - "6379:6379"

volumes:
  sawiya_pg_data:
