server.port=8080

spring.application.name=auth-service

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-minutes=${ACCESS_TOKEN_EXPIRY_MIN:15}
app.jwt.refresh-token-expiry-days=${REFRESH_TOKEN_EXPIRY_DAYS:7}
app.cookie.secure=${COOKIE_SECURE:false}

resilience4j.circuitbreaker.instances.redis.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=${CB_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=${CB_WAIT_DURATION_OPEN:10s}
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=${CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.redis.automatic-transition-from-open-to-half-open-enabled=${CB_AUTO_TRANSITION_HALF_OPEN:true}
resilience4j.circuitbreaker.instances.redis.record-exceptions=java.lang.Exception

logging.level.com.sawiya.auth=DEBUG
