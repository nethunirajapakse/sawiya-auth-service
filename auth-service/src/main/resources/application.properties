server.port=8080

spring.application.name=auth-service

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-minutes=${ACCESS_TOKEN_EXPIRY_MIN:15}
app.jwt.refresh-token-expiry-days=${REFRESH_TOKEN_EXPIRY_DAYS:7}
app.cookie.secure=${COOKIE_SECURE:false}

resilience4j.circuitbreaker.instances.redis.sliding-window-size=10
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redis.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.redis.record-exceptions=java.lang.Exception
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=5

logging.level.com.sawiya.auth=DEBUG
