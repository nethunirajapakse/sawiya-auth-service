server:
  port: 8080

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sawiya_auth_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    # In production, load these from environment variables / a secrets manager, never commit real secrets.
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-please-32bytes+}
    access-token-expiry-minutes: ${ACCESS_TOKEN_EXPIRY_MIN:15}
    refresh-token-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
  cookie:
    secure: ${COOKIE_SECURE:false} # set true in production (HTTPS only)

logging:
  level:
    com.sawiya.auth: DEBUG
