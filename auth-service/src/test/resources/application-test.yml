spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost
      port: 6380 # embedded redis test port, kept distinct from a dev instance on 6379

app:
  jwt:
    secret: test-only-secret-key-not-for-production-use-32bytes+
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  cookie:
    secure: false
